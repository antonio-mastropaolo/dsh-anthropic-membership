name: Release

# Runs only when a version tag is pushed (a push needs write access, so forks and pull requests never reach it).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Nothing by default; every job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag, test, pack
    if: github.repository == 'antonio-mastropaolo/dsh-model-hub' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Tag equals package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/release-check.mjs tag "$TAG"
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Release notes come from a dated CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/release-check.mjs notes "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Release script tests
        run: node --test .github/scripts/*.test.mjs
      - name: npm test
        run: |
          npm test 2>&1 | tee test.log
          grep -Eq '^(ℹ|#) fail 0$' test.log
      - name: Pack the tarball that will be published
        run: |
          mkdir "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/pack/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pack
          path: ${{ runner.temp }}/pack
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: verify
    if: github.repository == 'antonio-mastropaolo/dsh-model-hub' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pack
          path: pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL=$(ls pack/*.tgz)
          npm publish "$TARBALL" --provenance --access public

  release:
    name: GitHub release
    needs: publish
    if: github.repository == 'antonio-mastropaolo/dsh-model-hub' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pack
          path: pack
      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" pack/*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file pack/release-notes.md
